<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace de classe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Mon espace de classe</h1>
<div class="tabs" id="nav"><button id="b-sem" onclick="showV('sem')">Ma semaine</button><button id="b-notes" onclick="showV('notes')">Notes et classement</button></div>
<section id="v-sem">
<p class="sub">Progression annuelle · maths</p>
<div class="chips" id="lv"></div>
<section class="hero" id="hero" aria-live="polite"></section>
<details class="card" id="suivi"><summary><b>Respect de la progression</b></summary><p class="m" style="margin:8px 0 6px">La progression est obligatoire : indique la dernière leçon terminée (régulation comprise) pour voir ton avance ou ton retard.</p><select id="sv" style="width:100%"></select><p id="sv-out" style="margin:8px 0 0"></p></details>
<div class="pick"><label for="d">Voir une autre date</label><input type="date" id="d"></div>
<ol id="list"></ol>
</section>
<section id="v-notes" hidden><div id="app"></div></section>
</main>
<script src="script.js"></script>
