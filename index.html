<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace de classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="top">
<p class="eyebrow">Mathématiques · année 2026-2027</p>
<h1>Mon espace de classe</h1>
</header>
<nav class="seg main-nav" id="nav" aria-label="Sections"><button id="b-sem" onclick="showV('sem')">Ma semaine</button><button id="b-notes" onclick="showV('notes')">Notes et classement</button></nav>

<section id="v-sem" class="view">
<div class="lvrow"><div class="seg" id="lv" aria-label="Niveau"></div><button id="today" class="ghost" hidden>Aujourd’hui</button></div>
<section class="hero" id="hero" aria-live="polite"></section>
<div class="card year"><div class="year-h"><b>L’année</b><p class="legend small"><span class="lg-done">faite</span><span class="lg-dn">devoir de niveau</span><span class="lg-off">congé</span></p></div><div id="year"></div></div>
<details class="card fold" id="suivi"><summary>Respect de la progression</summary>
<div class="fold-b"><p class="m">Indique la dernière leçon terminée, régulation comprise, pour voir ton avance ou ton retard.</p>
<select id="sv" class="full" aria-label="Dernière leçon terminée"></select><p id="sv-out" class="sv-out"></p></div></details>
</section>

<section id="v-notes" class="view" hidden><div id="app"></div></section>
</main>
<script src="script.js"></script>
</body>
</html>
